spring:
  datasource:
    url: jdbc:h2:mem:qa_lab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

qa:
  api-key: ${QA_API_KEY:qa-secret-key}
